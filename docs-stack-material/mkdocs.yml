site_name: Docs Stack – Material
site_url: https://ashif-ek.github.io/docs-stack-material/
site_description: Centralized engineering knowledge base and technical specifications for production-grade web applications and open-source platforms.
site_author: Ashif EK
repo_name: ashif-ek/docs-stack-material
repo_url: https://github.com/ashif-ek/docs-stack-material

copyright: 'Copyright &copy; 2026 <a href="https://ashif-ek.vercel.app" target="_blank" rel="noopener">Ashif EK</a> &bull; <a href="https://ashif-ek.vercel.app" target="_blank" rel="noopener">Portfolio</a>'

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://ashif-ek.vercel.app
      name: Ashif's Portfolio
    - icon: fontawesome/brands/github
      link: https://github.com/ashif-ek
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/ashifek
      name: LinkedIn

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Conventions: conventions.md
  - Guides:
      - Local Development: guides/local-development.md
      - Deployment: guides/deployment.md
      - Customization: guides/customization.md
  - API:
      - Overview: api/overview.md
      - Authentication: api/authentication.md
      - Database: api/database.md
      - Error Handling: api/error-handling.md
  - Projects:
      - Portfolio: projects/portfolio.md
      - Open Source:
          - Task Management Client: projects/github_repos/task-management-client.md
          - Content Publishing Engine: projects/github_repos/content-publishing-engine.md
          - Edu-Management System: projects/github_repos/edu-management-system.md
          - Portfolio UI Platform: projects/github_repos/portfolio-ui.md
          - Salary Analytics Engine: projects/github_repos/salary-analytics-engine.md
          - Noirel Ecommerce: projects/github_repos/noirel-ecommerce.md
          - Time Lens: projects/github_repos/time-lens-python.md
          - Cipher Analytics: projects/github_repos/cipher-analytics.md
          - WorkPilot: projects/github_repos/workpilot.md
          - SkillStack: projects/github_repos/skill-stack.md
      - Architecture Lab:
          - Full Stack Blog: projects/github_repos/fullstack-blog-jwt-docker.md
          - Portfolio React (PWA): projects/github_repos/portfolio-react.md
          - Salary Checker: projects/github_repos/salary-checker.md
          - Student Management: projects/github_repos/student-management-django-task.md
          - Todo Redux Advanced: projects/github_repos/todo-redux-adv.md
  - Reference:
      - CLI: reference/cli.md
      - Configuration Options: reference/configuration-options.md
      - Glossary: reference/glossary.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
